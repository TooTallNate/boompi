# XcodeGen spec for the Boompi iOS app. The generated .xcodeproj is
# not committed - run `xcodegen` in this directory (brew install
# xcodegen) on a machine with Xcode, then open Boompi.xcodeproj.
name: Boompi
# Per-developer signing lives in local.yml (gitignored) so it survives
# regeneration - e.g.:
#   settings:
#     DEVELOPMENT_TEAM: ABCDE12345
include:
  - path: local.yml
    relativePaths: false
    enable: true
options:
  bundleIdPrefix: io.n8
  deploymentTarget:
    iOS: "17.0"
packages:
  BoompiKit:
    path: BoompiKit
targets:
  Boompi:
    type: application
    platform: iOS
    sources: [Boompi]
    dependencies:
      - package: BoompiKit
    info:
      path: Boompi/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Boompi
        # Required for CoreBluetooth; shown in the permission prompt.
        NSBluetoothAlwaysUsageDescription: >-
          Boompi uses Bluetooth to find and control your speaker -
          no Wi-Fi or account needed.
        # Bonjour discovery of boxes on the LAN (_boompi._tcp, see
        # rust/boompid/src/netname.rs); both keys are required for
        # NWBrowser, and the description shows in the local-network
        # permission prompt.
        NSLocalNetworkUsageDescription: >-
          Boompi finds and controls speakers on your Wi-Fi network.
        NSBonjourServices: [_boompi._tcp]
        # The control WebSocket is cleartext ws:// on the LAN; ATS
        # needs the local-networking carve-out to allow it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Keep the GATT link alive while backgrounded/locked - without
        # this iOS tears the connection down on suspend, which shows
        # up as constant 'connection lost' churn.
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
