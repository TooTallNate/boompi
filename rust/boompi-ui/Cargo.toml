[package]
name = "boompi-ui"
description = "Boompi touchscreen UI (Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
boompi-proto = { path = "../boompi-proto" }

anyhow = { workspace = true }
chrono = "0.4"
clap = { workspace = true }
futures-util = "0.3"
# Album art decode (AVRCP thumbnails are JPEG; PNG for future sources).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Settings-URL QR code on the panel.
qrcode = { version = "0.14", default-features = false }
serde_json = { workspace = true }
# Default backend: winit (laptop dev). On the Pi, build with
# `--no-default-features --features kms` for direct DRM/KMS rendering.
slint = { version = "1", default-features = false, features = [
    "compat-1-2",
    "std",
    # Runtime font registration (register_emoji_fallback in main.rs):
    # the bundled Noto Color Emoji is the emoji fallback on every
    # platform, so all environments render emoji identically.
    "unstable-fontique-010",
] }
tokio = { workspace = true, features = ["rt", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
boompi-panel = { path = "../boompi-panel" }
# Touch-ripple feedback reads touch events from evdev in parallel with
# Slint's own input path (evdev fans out to all readers).
evdev = "0.12"

[build-dependencies]
slint-build = "1"

[features]
default = ["desktop"]
# Laptop preview (winit window). Skia, same renderer as the boxes:
# FemtoVG cannot rasterize CBDT color emoji above its glyph-atlas size
# cutoff (bitmap-only glyphs have no outline fallback), so large-scale
# emoji silently vanish there.
desktop = ["slint/backend-winit", "slint/renderer-skia", "slint/accessibility"]
# On the Pi: direct DRM/KMS + libinput, CPU rendering.
kms = ["slint/backend-linuxkms-noseat", "slint/renderer-software"]
# On the Pi: direct DRM/KMS + libinput, OpenGL ES rendering (vc4).
kms-gl = ["slint/backend-linuxkms-noseat", "slint/renderer-femtovg"]
# On the Pi: direct DRM/KMS + libinput, Skia (GLES via EGL/GBM).
# The only Slint renderer with color emoji support.
kms-skia = ["slint/backend-linuxkms-noseat", "slint/renderer-skia"]
