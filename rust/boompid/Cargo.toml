[package]
name = "boompid"
description = "Boompi backend daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
boompi-proto = { path = "../boompi-proto" }

anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Linux-only hardware integrations (BlueZ via zbus, PipeWire, I2C) land in
# Phase 1 behind cfg(target_os = "linux") so the workspace stays
# cross-platform for laptop UI development.
