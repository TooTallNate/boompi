[package]
name = "boompid"
description = "Boompi backend daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
boompi-proto = { path = "../boompi-proto" }

anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws", "multipart"] }
bytes = "1"
# AirPlay cover art arrives as a raw buffer dump (valid image + garbage
# tail, sometimes mid-write); decode-validate before publishing.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
# Settings web UI (web/dist, committed prebuilt - regenerate via `make web`).
rust-embed = { version = "8", features = ["mime-guess"] }
realfft = "3"
# Home Assistant integration (MQTT discovery).
# default-features off: MQTT speaks plaintext to a LAN broker (Home
# Assistant); the TLS feature dragged in an EOL rustls 0.22/webpki
# 0.102 that collected CVEs (dependabot 22-25).
rumqttc = { version = "0.25", default-features = false }
# Direct dep only to pin the process-level CryptoProvider: the graph
# contains both ring (librespot, reqwest) and aws-lc-rs (hyper-proxy2's
# hyper-rustls), and rustls panics at first TLS use when it can't
# auto-pick. main() installs ring explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
clap = { workspace = true }
serde = { workspace = true }
# Unknown config keys warn instead of failing the boot (config.rs).
serde_ignored = "0.1"
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "process",
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Linux-only hardware integrations, cfg-gated so the workspace stays
# cross-platform for laptop development (verify with `make cross-boompid`).
[target.'cfg(target_os = "linux")'.dependencies]
boompi-panel = { path = "../boompi-panel" }
# OTA update assets are zstd streams decompressed straight onto the
# inactive slot's partitions (update.rs).
async-compression = { version = "0.4", default-features = false, features = ["tokio", "zstd"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
ina260 = { path = "../ina260" }
# Spotify Connect, embedded (pure-Rust feature set: rustls TLS, no audio
# backends - we provide a pw-cat sink). Zeroconf: avahi when the daemon is
# present (it owns UDP :5353 once shairport-sync/AirPlay is in the picture;
# a second responder via libmdns dies with 'responder died' panics that take
# the whole daemon down), libmdns as the avahi-less fallback.
librespot = { version = "0.8", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "with-avahi",
    "with-libmdns",
] }
linux-embedded-hal = "0.4"
# Cover art downloads (Spotify CDN; later the online-art fallback),
# GitHub release queries + OTA downloads ("stream" for bytes_stream -
# update.rs pipes the body through the zstd decoder).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
sha2 = "0.10"
zbus = { version = "5", default-features = false, features = ["tokio"] }
