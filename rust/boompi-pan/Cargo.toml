[package]
name = "boompi-pan"
description = "Standalone BlueZ NAP registrar for the pre-created br-pan bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
tokio = { workspace = true, features = ["rt", "macros", "signal", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Exercise the D-Bus state machine on developer machines without Bluetooth.
[dev-dependencies]
futures-util = "0.3"
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
