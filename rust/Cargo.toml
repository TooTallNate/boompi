[workspace]
resolver = "2"
members = ["boompi-proto", "boompid", "boompi-ui", "ina260", "kms-test"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "MIT"
repository = "https://github.com/TooTallNate/boompi"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"

[profile.release]
lto = "thin"
strip = true
