# Build the Boompi Pi 3 Buildroot SD card image on every commit.
#
# Strategy: Buildroot builds the system layer (kernel, systemd, BlueZ,
# PipeWire, UI runtime libs) with dl/ccache caching; the Rust binaries are
# cross-built with cargo-zigbuild against Buildroot's *staging* sysroot
# (same technique as the local `make cross-*` dev loop) and injected via
# the rootfs-overlay-ci directory before the image is assembled. This keeps
# per-commit Rust builds to minutes (GH cache) instead of uncached
# buildroot-cargo builds.
#
# First run (cold caches): ~2-3 h. Warm runs: much faster.

name: image

on:
  push:
    # Only the main branch: without a filter the changesets
    # "Version Packages" branch would trigger multi-hour image builds
    # of its own.
    branches: [main]
    # Docs-only commits shouldn't trigger multi-hour image builds.
    paths:
      - "rust/**"
      - "web/**"
      - "buildroot/**"
      - "scripts/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

# Never cancel a running image build (they're long); the newest queued
# run supersedes older queued ones and starts when the current finishes.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  # LTS line (YYYY.02). 2026.02 brings shairport-sync 4.3.7 + nqptp,
  # unlocking AirPlay 2.
  BR_VERSION: "2026.02"

jobs:
  # boompi-grow-data resizes the shared /data partition on live boxes:
  # prove the exact script against a loopback disk with the real
  # partition layout before any image carries it.
  grow-test:
    name: grow-data loopback test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Exercise boompi-grow-data on a loop device
        run: |
          set -eux
          truncate -s 1024M disk.img
          # Real card layout: 3 primaries, extended p4 wrapping logical
          # p5/p6, free space after p4 (the unused rest of the card).
          sfdisk disk.img <<'EOF'
          label: dos
          1 : start=8192, size=16384, type=c
          2 : start=24576, size=16384, type=c
          3 : start=40960, size=204800, type=83
          4 : start=245760, size=442368, type=5
          5 : start=253952, size=204800, type=83
          6 : start=466944, size=131072, type=83
          EOF
          LOOP=$(sudo losetup -P --show -f disk.img)
          sudo mkfs.ext4 -q -L data "${LOOP}p6"
          mkdir -p mnt && sudo mount "${LOOP}p6" mnt
          echo "survives the grow" | sudo tee mnt/canary >/dev/null
          sudo umount mnt
          BEFORE=$(cat /sys/class/block/$(basename "$LOOP")p6/size)
          sudo env BOOMPI_GROW_DISK="$LOOP"             sh buildroot/board/boompi/rootfs-overlay/usr/bin/boompi-grow-data
          AFTER=$(cat /sys/class/block/$(basename "$LOOP")p6/size)
          test "$AFTER" -gt "$BEFORE"
          # Ends at the disk end (within alignment slack).
          END=$(( $(cat /sys/class/block/$(basename "$LOOP")p6/start) + AFTER ))
          DISK=$(cat /sys/class/block/$(basename "$LOOP")/size)
          test $((DISK - END)) -lt 32768
          # Filesystem grew and the data survived.
          sudo mount "${LOOP}p6" mnt
          grep -q "survives the grow" mnt/canary
          df -m mnt | tail -1
          sudo umount mnt
          # Idempotent: second run is a no-op.
          sudo env BOOMPI_GROW_DISK="$LOOP"             sh buildroot/board/boompi/rootfs-overlay/usr/bin/boompi-grow-data
          test "$(cat /sys/class/block/$(basename "$LOOP")p6/size)" -eq "$AFTER"
          sudo losetup -d "$LOOP"

  # web/dist is a build artifact (boompid embeds it via rust-embed).
  # Build it once here; both board jobs download it before the Rust
  # cross-build.
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Build web UI
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter boompi build

      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: boompi-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 14

  # Skia built from source with COLRv1 support. The rust-skia prebuilt
  # binaries are compiled against old FreeType headers, which compiles
  # Skia's COLRv1 code path out entirely (FT_Get_Color_Glyph_Paint is
  # absent; only the COLRv0 FT_Get_Color_Glyph_Layer made it in), so
  # modern color emoji fonts render blank on the boxes. Building on the
  # arm64 runner against Ubuntu 24.04's FreeType 2.13 headers turns the
  # path on; the board jobs consume the result via SKIA_BINARIES_URL
  # (same crate version + features + target triple = same cache key as
  # the zigbuild step computes). Cached per skia-bindings version, so
  # this ~40 min build runs about once per Slint upgrade.
  skia:
    name: skia (arm64, COLRv1)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Skia version key
        id: ver
        run: |
          V=$(grep -A1 'name = "skia-bindings"' rust/Cargo.lock | grep version | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Restore built binaries
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: skia-out
          key: skia-colrv1-${{ steps.ver.outputs.version }}-kms-skia-v1

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             clang ninja-build python3 git curl             libfreetype-dev libfontconfig-dev             libegl1-mesa-dev libgles-dev libgl-dev libgbm-dev             libinput-dev libudev-dev libxkbcommon-dev
          # The whole point: 24.04's FreeType headers must be >= 2.13.
          pkg-config --modversion freetype2

      - name: Build Skia from source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup target list >/dev/null # ensure rustup is warm
          # Pass 1 (downloads the official prebuilt): capture the exact
          # binaries key the crate computes, and prove the prebuilt is
          # missing COLRv1 so this job stays honest.
          cargo build --manifest-path rust/Cargo.toml --release             -p boompi-ui --no-default-features --features kms-skia
          OUT=$(ls -d rust/target/release/build/skia-bindings-*/out/skia | head -1)
          KEY=$(cat "$OUT/key.txt"); TAG=$(cat "$OUT/tag.txt")
          echo "key=$KEY tag=$TAG"
          if nm "$OUT/libskia.a" 2>/dev/null | grep -q FT_Get_Color_Glyph_Paint; then
            echo "::notice::official prebuilt now has COLRv1 - this job may be obsolete"
          fi
          # Pass 2: force the source build (rerun-if-env-changed on
          # FORCE_SKIA_BUILD makes cargo redo skia-bindings).
          FORCE_SKIA_BUILD=1 cargo build --manifest-path rust/Cargo.toml --release             -p boompi-ui --no-default-features --features kms-skia
          OUT=$(ls -d rust/target/release/build/skia-bindings-*/out/skia | head -1)
          # The assertion this job exists for:
          nm "$OUT/libskia.a" | grep -q FT_Get_Color_Glyph_Paint             || { echo "::error::source-built Skia still lacks COLRv1"; exit 1; }
          # Package in the skia-binaries layout (top-level dir, files
          # moved up by the crate's unpack()).
          mkdir -p skia-out/stage/skia-binaries
          cp "$OUT"/bindings.rs "$OUT"/*.a skia-out/stage/skia-binaries/
          cp "$OUT"/LICENSE_SKIA skia-out/stage/skia-binaries/ 2>/dev/null ||             cp ~/.cargo/registry/src/*/skia-bindings-*/LICENSE_SKIA skia-out/stage/skia-binaries/
          echo -n "$KEY" > skia-out/stage/skia-binaries/key.txt
          echo -n "$TAG" > skia-out/stage/skia-binaries/tag.txt
          tar czf "skia-out/skia-binaries-$KEY.tar.gz" -C skia-out/stage skia-binaries
          rm -rf skia-out/stage
          ls -la skia-out/

      - name: Save built binaries
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: skia-out
          key: skia-colrv1-${{ steps.ver.outputs.version }}-kms-skia-v1

      - name: Upload skia binaries
        uses: actions/upload-artifact@v7
        with:
          name: skia-binaries-arm64
          path: skia-out/skia-binaries-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  image:
    needs: [web, skia, grow-test]
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      BR2_DL_DIR: /home/runner/br-dl
      OUTPUT: /home/runner/br-output
    steps:
      - uses: actions/checkout@v7
        with:
          # The version stamp diffs web/package.json against HEAD~1.
          fetch-depth: 2

      # The OS version baked into the image (/etc/boompi-version,
      # surfaced in the settings UIs and used by the on-box updater):
      # clean "vX.Y.Z" when this commit is the changesets version-bump
      # merge (the commit a release is cut from), "vX.Y.Z-<sha>"
      # otherwise.
      - name: Version stamp
        id: stamp
        run: |
          V=$(jq -r .version web/package.json)
          PREV=$(git show HEAD~1:web/package.json 2>/dev/null | jq -r .version || echo "")
          if [ "$PREV" != "$V" ]; then
            STAMP="v$V"
          else
            STAMP="v$V-$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=$STAMP" >> "$GITHUB_OUTPUT"
          echo "OS version: $STAMP"

      # ---- Base-image cache --------------------------------------------------
      # buildroot/** (plus the defconfig generator and this workflow)
      # fingerprints the SYSTEM layer. When a commit touches only the
      # apps (rust/, web/), the previous run's images and staging
      # sysroot are restored and Buildroot never runs: the Rust
      # binaries are rebuilt and spliced into the cached image
      # (~15 min instead of ~45). Any buildroot-affecting change
      # misses this cache and takes the full path below, which then
      # repopulates it. rootfs-overlay-ci is excluded because the full
      # path generates it mid-run.
      - name: Restore base image cache
        id: base
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/br-base
          key: br-base-${{ env.BR_VERSION }}-${{ hashFiles('buildroot/**', '!buildroot/board/boompi/rootfs-overlay-ci/**', 'scripts/gen-defconfig.sh', '.github/workflows/image.yml') }}

      - name: Install host dependencies
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev \
            rsync cpio file wget unzip ccache

# Caches are split into restore/save pairs with `if: always()` so a failed
      # build still persists its progress (kernel/toolchain objects, downloads)
      # - otherwise every red run repeats the full ~80 min pass 1.
      - name: Restore Buildroot downloads
        if: steps.base.outputs.cache-hit != 'true'
        id: restore-br-dl
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/br-dl
          key: br-dl-${{ env.BR_VERSION }}-${{ hashFiles('buildroot/configs/*.frag', 'buildroot/buildroot-patches/*.patch') }}
          restore-keys: |
            br-dl-${{ env.BR_VERSION }}-

      - name: Restore ccache
        if: steps.base.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.buildroot-ccache
          key: br-ccache-${{ github.sha }}
          restore-keys: |
            br-ccache-

      - name: Restore cargo cache
        id: restore-cargo
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: cargo-image-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-image-

      - name: Fetch Buildroot ${{ env.BR_VERSION }}
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://buildroot.org/downloads/buildroot-${BR_VERSION}.tar.xz" | tar -xJ -C "$HOME"
          mv "$HOME/buildroot-${BR_VERSION}" "$HOME/buildroot"
          # Local fixes to the Buildroot tree itself (e.g. the rpi-firmware
          # version bump - the BR2_EXTERNAL mechanism cannot override
          # package versions).
          for p in "$GITHUB_WORKSPACE"/buildroot/buildroot-patches/*.patch; do
            patch -d "$HOME/buildroot" -p1 -E < "$p"
          done

      - name: Configure
        if: steps.base.outputs.cache-hit != 'true'
        # The defconfig is generated from the fragments
        # (buildroot/configs/*.frag) so nothing can drift.
        run: |
          scripts/gen-defconfig.sh > "$HOME/boompi_defconfig"
          make -C "$HOME/buildroot" O="$OUTPUT" \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" \
            BR2_DEFCONFIG="$HOME/boompi_defconfig" defconfig

      - name: Build system (pass 1)
        if: steps.base.outputs.cache-hit != 'true'
        run: make -C "$OUTPUT" -j"$(nproc)"

      - name: Install Rust cross tooling
        run: |
          rustup target add aarch64-unknown-linux-gnu
          # The pip package pulls in `ziglang` (zig itself) as a dependency;
          # pipx isolation would hide it from cargo-zigbuild's discovery.
          pip install --break-system-packages cargo-zigbuild

      # boompid's rust-embed reads web/dist at compile time.
      - name: Fetch web dist
        uses: actions/download-artifact@v7
        with:
          name: boompi-web-dist
          path: web/dist

      # COLRv1-capable Skia from the arm64 job (see the skia job).
      - name: Fetch skia binaries
        uses: actions/download-artifact@v7
        with:
          name: skia-binaries-arm64
          path: /home/runner/skia-binaries

      - name: Cross-build boompid + boompi-ui against staging
        run: |
          STAGING="$OUTPUT/staging"
          # Fast path: the staging sysroot restored with the base image.
          if [ "${{ steps.base.outputs.cache-hit }}" = "true" ]; then
            STAGING=/home/runner/br-base/staging
          fi
          # Target exactly the image's glibc so linking against staging .so
          # files never references newer symbol versions than zig provides.
          # NB: `$OUTPUT/staging` is a symlink into host/<tuple>/sysroot, so
          # `find` needs -L to descend into it (without it, detection came up
          # empty and we silently linked against an ancient fallback glibc,
          # which blew up much later with undefined GLIBC_2.3x references).
          LIBC="$(find -L "$STAGING" -name 'libc.so.6' -type f | head -1)"
          GLIBC="$(grep -aoE 'release version [0-9]+\.[0-9]+' "$LIBC" 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+' || true)"
          if [ -z "$GLIBC" ]; then
            echo "::error::failed to detect glibc version from staging sysroot (libc: '${LIBC:-not found}')"
            exit 1
          fi
          echo "staging glibc: $GLIBC"
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_SYSROOT_DIR="$STAGING"
          export PKG_CONFIG_LIBDIR="$STAGING/usr/lib/pkgconfig:$STAGING/usr/share/pkgconfig"
          export RUSTFLAGS="-L $STAGING/usr/lib"
          cargo zigbuild --manifest-path rust/Cargo.toml --release \
            --target "aarch64-unknown-linux-gnu.$GLIBC" -p boompid
          # Skia GPU renderer on both boards (GLES/EGL via mesa - V3D on
          # the Pi 4, VC4 on the Pi 3; Phase 0 validated Skia GL on Pi 3).
          # The Skia prebuilt is C++ built against GNU libstdc++; zig
          # substitutes its own libc++ for `-lstdc++`, so link the real
          # staging libstdc++ by path.
          LIBSTDCPP="$(find -L "$STAGING" -name 'libstdc++.so.6' | head -1)"
          export RUSTFLAGS="$RUSTFLAGS -C link-arg=$LIBSTDCPP"
          # Use the COLRv1-capable Skia from the arm64 job; same crate
          # version/features/triple, so the computed {key} matches.
          export SKIA_BINARIES_URL="file:///home/runner/skia-binaries/skia-binaries-{key}.tar.gz"
          cargo zigbuild --manifest-path rust/Cargo.toml --release \
            --target "aarch64-unknown-linux-gnu.$GLIBC" \
            -p boompi-ui --no-default-features --features kms-skia

      - name: Inject binaries + emoji font into the image overlay
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          OVL="buildroot/board/boompi/rootfs-overlay-ci"
          install -D -m 0755 rust/target/aarch64-unknown-linux-gnu/release/boompid "$OVL/usr/bin/boompid"
          install -D -m 0755 rust/target/aarch64-unknown-linux-gnu/release/boompi-ui "$OVL/usr/bin/boompi-ui"
          install -D -m 0644 /dev/null "$OVL/etc/boompi-version"
          printf '%s' "${{ steps.stamp.outputs.version }}" > "$OVL/etc/boompi-version"
          # Color Noto Emoji (both boards), COLRv1 build - vector color
          # glyphs stay crisp at every UI scale, unlike the 128px CBDT
          # bitmaps. Requires the source-built Skia from the skia job
          # (the rust-skia prebuilt has COLRv1 compiled out and renders
          # this font as blanks). Pinned to the google/fonts commit whose
          # file was bench-verified; sha-checked so an upstream swap
          # fails the build instead of shipping blanks.
          curl -fsSL --create-dirs -o "$OVL/usr/share/fonts/NotoColorEmoji.ttf" \
            "https://github.com/google/fonts/raw/be7a91f7db2db749ebfc36f598eb85501127e7db/ofl/notocoloremoji/NotoColorEmoji-Regular.ttf"
          echo "be73479ba4fa277c89b85cd6c71717df30d9d0eff6da8c1e1a201e5b95459299  $OVL/usr/share/fonts/NotoColorEmoji.ttf" \
            | sha256sum -c -

      - name: Build image (pass 2, picks up the overlay)
        if: steps.base.outputs.cache-hit != 'true'
        run: make -C "$OUTPUT" -j"$(nproc)"

      # Full path: stage the system layer for future app-only commits.
      # The staging sysroot rides along because the Rust cross-build
      # links against it (headers, .pc files, libstdc++). The images
      # contain THIS commit's binaries - harmless, the fast path
      # replaces them wholesale.
      - name: Populate base image cache
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/br-base
          cp "$OUTPUT/images/sdcard.img" "$OUTPUT/images/rootfs.ext4" \
             "$OUTPUT/images/boot-a.vfat" "$OUTPUT/images/boot-b.vfat" \
             /home/runner/br-base/
          cp -a "$(readlink -f "$OUTPUT/staging")" /home/runner/br-base/staging

      # Fast path: splice the freshly built binaries into the cached
      # image. The rootfs is loop-mounted and patched (binaries +
      # version stamp), fsck'd, then dd'd into both A/B rootfs windows
      # of the card image. Boot partitions are system-layer content
      # and come straight from the cache.
      - name: Splice binaries into cached base image
        if: steps.base.outputs.cache-hit == 'true'
        run: |
          set -eux
          mkdir -p "$OUTPUT/images"
          cp /home/runner/br-base/rootfs.ext4 /home/runner/br-base/sdcard.img \
             /home/runner/br-base/boot-a.vfat /home/runner/br-base/boot-b.vfat \
             "$OUTPUT/images/"
          ROOTFS="$OUTPUT/images/rootfs.ext4"
          BIN=rust/target/aarch64-unknown-linux-gnu/release
          MNT=$(mktemp -d)
          sudo mount -o loop "$ROOTFS" "$MNT"
          sudo install -m 0755 "$BIN/boompid"   "$MNT/usr/bin/boompid"
          sudo install -m 0755 "$BIN/boompi-ui" "$MNT/usr/bin/boompi-ui"
          printf '%s' "${{ steps.stamp.outputs.version }}" \
            | sudo tee "$MNT/etc/boompi-version" >/dev/null
          sudo umount "$MNT"
          # 0 = clean, 1 = fixed something; both fine.
          e2fsck -f -p "$ROOTFS" || [ "$?" -le 1 ]
          # Both A/B windows of the card image get the patched rootfs.
          SD="$OUTPUT/images/sdcard.img"
          for part in 3 5; do
            START=$(sfdisk -d "$SD" | sed -n "s/^.*img${part} :.*start= *\([0-9]*\).*/\1/p")
            SIZE=$(sfdisk -d "$SD" | sed -n "s/^.*img${part} :.*size= *\([0-9]*\).*/\1/p")
            test -n "$START" && test -n "$SIZE"
            # The rootfs must fit its window exactly or smaller.
            test "$(stat -c %s "$ROOTFS")" -le "$((SIZE * 512))"
            dd if="$ROOTFS" of="$SD" bs=1M oflag=seek_bytes \
               seek="$((START * 512))" conv=notrunc status=none
          done
          # Sanity: read the version back out of the card's slot A.
          P3=$(sfdisk -d "$SD" | sed -n "s/^.*img3 :.*start= *\([0-9]*\).*/\1/p")
          sudo mount -o loop,ro,offset=$((P3 * 512)) "$SD" "$MNT"
          test "$(cat "$MNT/etc/boompi-version")" = "${{ steps.stamp.outputs.version }}"
          cmp "$MNT/usr/bin/boompid" "$BIN/boompid"
          sudo umount "$MNT"

      - name: Compress image
        run: |
          ls -la "$OUTPUT/images/"
          xz -T0 -f "$OUTPUT/images/sdcard.img"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: boompi-sdcard
          path: /home/runner/br-output/images/sdcard.img.xz
          if-no-files-found: error
          retention-days: 14

      # OTA bundle for the A/B updater (the SD cards are inaccessible once
      # the boxes are assembled - see boompi-update-slot /
      # scripts/update-appliance.sh). Both boards use the same layout.
      - name: Upload update bundle
        uses: actions/upload-artifact@v7
        with:
          name: boompi-update
          path: |
            /home/runner/br-output/images/rootfs.ext4
            /home/runner/br-output/images/boot-a.vfat
            /home/runner/br-output/images/boot-b.vfat
          if-no-files-found: error
          retention-days: 14

      # Content-keyed caches (br-dl, cargo) can only be saved once per key;
      # unconditional saves warn 'unable to reserve cache' on every warm run.
      # The ccache key includes the commit SHA, so it always saves cleanly.
      - name: Save Buildroot downloads
        if: always() && steps.base.outputs.cache-hit != 'true' && steps.restore-br-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /home/runner/br-dl
          key: br-dl-${{ env.BR_VERSION }}-${{ hashFiles('buildroot/configs/*.frag', 'buildroot/buildroot-patches/*.patch') }}

      - name: Save ccache
        if: always() && steps.base.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /home/runner/.buildroot-ccache
          key: br-ccache-${{ github.sha }}

      # Content-keyed like br-dl: only the full path produces it, and
      # only a missing key needs it.
      - name: Save base image cache
        if: steps.base.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /home/runner/br-base
          key: br-base-${{ env.BR_VERSION }}-${{ hashFiles('buildroot/**', '!buildroot/board/boompi/rootfs-overlay-ci/**', 'scripts/gen-defconfig.sh', '.github/workflows/image.yml') }}

      - name: Save cargo cache
        if: always() && steps.restore-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: cargo-image-${{ hashFiles('rust/Cargo.lock') }}

  # Rolling "edge" prerelease: every green build of the dev branch
  # replaces it. Boxes with the bleeding-edge update channel enabled
  # follow this instead of the tagged releases. Same asset name and
  # format as a real release (a contract with boompid's updater),
  # minus the sdcard image (edge is OTA-only). The version stamp rides
  # in the release notes ("stamp: ..."), keeping the asset list to
  # exactly the self-contained update bundle.
  edge:
    needs: image
    # Pushes and manual re-runs both refresh edge (dispatch exists for
    # rebuilding when a push was missed, e.g. the branch-rename force
    # push whose v1-to-v2 mega-diff blew past the paths filter's
    # 300-file window).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    name: edge prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Version stamp
        id: stamp
        run: |
          V=$(jq -r .version web/package.json)
          PREV=$(git show HEAD~1:web/package.json 2>/dev/null | jq -r .version || echo "")
          if [ "$PREV" != "$V" ]; then
            STAMP="v$V"
          else
            STAMP="v$V-$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=$STAMP" >> "$GITHUB_OUTPUT"

      - name: Download update bundle
        uses: actions/download-artifact@v7
        with:
          name: boompi-update
          path: dl

      - name: Prepare edge assets
        env:
          STAMP: ${{ steps.stamp.outputs.version }}
        run: |
          sudo apt-get install -y --no-install-recommends zstd
          mkdir -p work assets && cd work
          : > SHA256SUMS.txt
          for f in rootfs.ext4 boot-a.vfat boot-b.vfat; do
            sha256sum "../dl/$f" | sed "s|../dl/$f|$f|" >> SHA256SUMS.txt
            zstd -T0 -15 --no-progress -o "$f.zst" "../dl/$f"
          done
          echo -n "$STAMP" > boompi-version.txt
          # One self-contained bundle. ustar, and manifest + stamp
          # FIRST: the on-box updater consumes this as a stream and
          # must see the sums before the payloads (a contract with
          # boompid's tarstream flow).
          tar --format=ustar -cf ../assets/boompi-update.tar \
            SHA256SUMS.txt boompi-version.txt \
            rootfs.ext4.zst boot-a.vfat.zst boot-b.vfat.zst
          ls -la ../assets

      - name: Update edge prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAMP: ${{ steps.stamp.outputs.version }}
        # Windowless update: move the tag, edit-or-create the release,
        # clobber the asset. Never delete - a failed step must leave
        # the previous edge intact, not a dark channel (learned the
        # hard way when a create 403 stranded the fleet's edge checks).
        run: |
          NOTES="$(printf 'Rolling prerelease: latest green build of the dev branch. OTA-only.\n\nstamp: %s' "$STAMP")"
          git push -f origin "$GITHUB_SHA:refs/tags/edge"
          if gh release view edge --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit edge \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "edge ($STAMP)" \
              --notes "$NOTES"
          else
            gh release create edge \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "edge ($STAMP)" \
              --notes "$NOTES"
          fi
          gh release upload edge --repo "$GITHUB_REPOSITORY" --clobber assets/*
