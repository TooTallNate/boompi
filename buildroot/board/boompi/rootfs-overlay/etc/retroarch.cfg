# Boompi baseline RetroArch configuration (KMS/GBM + GLES2, udev
# input, PipeWire audio). Launched by boompid, which stops the panel
# UI first (one DRM master at a time) and restarts it on exit. User
# content and state live on /data/games (survives OS updates).
video_driver = "gl"
# Hardware-context cores (mupen64plus-next) make GL calls that need
# RetroArch's context shared with them - without this the core dies
# in EGL before reaching its renderer (bench-proven on N64).
video_shared_context = "true"
audio_driver = "pipewire"
input_driver = "udev"
input_joypad_driver = "udev"
# Touch in the menu (tap to select, drag to scroll): the panel's
# touchscreen is free while a game runs (boompi-ui is stopped), but
# RetroArch defaults pointer input OFF outside mobile builds. The
# menu_rotation patch remaps taps to match rotated panels.
menu_pointer_enable = "true"
menu_driver = "rgui"
# Button maps for the udev joypad driver (retroarch-joypad-autoconfig
# package); without them a pad is detected but completely unmapped.
joypad_autoconfig_dir = "/usr/share/retroarch/autoconfig"
libretro_directory = "/usr/lib/libretro"
system_directory = "/data/games/bios"
savefile_directory = "/data/games/saves"
savestate_directory = "/data/games/states"
rgui_config_directory = "/data/games"
video_fullscreen = "true"
pause_nonactive = "false"
# No OSD notifications ("Loading content", autoconfig toasts, save
# messages): they draw unrotated over rotated panels and the appliance
# has its own UI for status. RGUI is unaffected - the menu draws its
# own text, so Quit/settings stay usable.
video_font_enable = "false"
menu_enable_widgets = "false"
# Never save back: RetroArch's default save-on-exit replaces this
# curated baseline with a full settings dump on first quit (observed
# on-box), silently diverging the running system from the image and
# discarding these comments. In-menu tweaks are deliberately session-
# only; durable settings belong in this file (or /data overrides via
# rgui_config_directory).
config_save_on_exit = "false"
# Start+Select quits directly (auto-savestate covers resume). The
# RGUI menu cannot follow video_rotation - the GL driver deliberately
# draws it with the unrotated mvp and KMS has no screen_orientation
# backend - so it renders sideways on rotated panels. Keep it off the
# main path: quit is a combo, boompid's stop control is the
# no-gamepad backstop, and the menu stays reachable on Hold Start for
# tinkering (sideways, known limitation).
# Combo values (input_defines.h): 4 = Start+Select, 7 = Hold Start.
# NB the previous value "2" here was L3+R3 - the old comment claiming
# Start+Select was wrong.
input_quit_gamepad_combo = "4"
input_menu_toggle_gamepad_combo = "7"
menu_swap_ok_cancel_buttons = "false"
savestate_auto_save = "true"
savestate_auto_load = "true"
