# Disable Wi-Fi powersave (2 = NM_SETTING_WIRELESS_POWERSAVE_DISABLE).
#
# brcmfmac powersave on the onboard Pi radio wedges the link silently:
# the chip stays "associated" (so NetworkManager stays activated and
# the panel says connected) while inbound traffic is blackholed - no
# deauth, no beacon-loss, no DHCP failure, nothing in any log. An idle
# boombox originates almost no traffic, so nothing notices until a
# human can't ping it (bench-bitten on nates, 2026-08: 30h of zero NM
# journal entries while unreachable; manual reconnect fixed it).
#
# The box is an appliance whose entire point is being reachable
# (AirPlay/Spotify/web UI); the idle-power cost is accepted.
[connection]
wifi.powersave = 2
