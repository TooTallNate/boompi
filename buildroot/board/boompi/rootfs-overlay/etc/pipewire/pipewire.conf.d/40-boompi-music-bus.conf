# The music bus: every music source's stream mixes here at unity, a
# loopback carries the mix into the real sink, and the ONE music
# volume lives on the loopback's output stream (set by boompid's
# mixer on node.name=music-out).
#
# Why a bus: the visualizer taps music-bus's monitor, which is
# pre-volume BY CONSTRUCTION - the spectrum bars show content at full
# resolution no matter how quiet the speaker is. (The old approach
# captured post-volume 16-bit audio and multiplied the loss back in:
# mathematically lossy, and at low volumes the bars drowned in
# quantization noise.)
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "music-bus"
            node.description = "Music bus (pre-volume mix)"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            object.linger    = true
            # Never the default sink; the loopback below is its only
            # consumer besides the visualizer tap.
            priority.session = 100
            monitor.channel-volumes = false
        }
    }
]
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Music bus to output"
            capture.props = {
                node.name   = "music-bus-capture"
                node.target = "music-bus"
                stream.capture.sink = true
                node.passive = true
            }
            playback.props = {
                node.name   = "music-out"
                # boompid's mixer steers this stream's volume: it IS
                # the music track's volume.
            }
        }
    }
]
