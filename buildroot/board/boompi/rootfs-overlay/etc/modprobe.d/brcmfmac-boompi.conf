# The pinned Raspberry Pi 6.6 kernel does not report port authorization
# after firmware-offloaded WPA2 authentication. wpa_supplicant 2.12 waits
# for that event and times out, even though association succeeded.
# Disable only FWSUP (bit 13) so wpa_supplicant performs the handshake;
# WPA2 encryption stays enabled. Revisit when upgrading the Wi-Fi driver.
options brcmfmac feature_disable=0x2000
