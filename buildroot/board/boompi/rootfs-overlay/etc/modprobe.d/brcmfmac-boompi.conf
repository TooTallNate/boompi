# Unpatched Raspberry Pi kernels (6.6 through 6.18) do not report port
# authorization after firmware-offloaded WPA2 authentication.
# wpa_supplicant 2.12 waits for that event and times out, even though
# association succeeded. Disable only FWSUP (bit 13) so wpa_supplicant
# performs the handshake; WPA2 encryption stays enabled.
#
# patches/linux/0006 backports the driver fix. Keep this workaround until
# that patch passes Wi-Fi tests on both Pi 3 and Pi 4 with offload enabled.
options brcmfmac feature_disable=0x2000
