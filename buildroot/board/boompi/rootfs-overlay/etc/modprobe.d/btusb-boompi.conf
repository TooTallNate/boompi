# Serialize btusb's interrupt/bulk URB completion handling.
#
# The Pi 3's dwc_otg USB controller can complete URBs out of order
# under concurrent load (BT HID + pairing bursts + isochronous USB
# audio on the same bus). btusb then reassembles HCI frames from
# shuffled fragments: dmesg fills with "Unexpected start frame", and
# the RTL8761BU (TP-Link UB500) descends from garbled traffic to a
# full HCI wedge - command tx timeouts, one bench bluetoothd SIGSEGV.
# force_poll_sync is the upstream remedy for exactly this class of
# transport (bench: reproduced twice without it during
# phone-pairs-while-gamepad-plays, gone with it).
#
# Harmless on sane controllers (pi4 xHCI): it only costs a little
# completion-path parallelism.
options btusb force_poll_sync=1
