# Appliance SSH access. Root is the only user; the SD card is hard (Pi 3)
# or nearly impossible (Pi 4, once assembled) to reach - locking ourselves
# out of a freshly flashed image is not an option (learned the hard way:
# stock 'prohibit-password' does exactly that).
# Key auth is baked in too (root/.ssh/authorized_keys in the overlay).
PermitRootLogin yes
