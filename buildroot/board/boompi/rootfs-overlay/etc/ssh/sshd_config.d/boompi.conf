# Host keys live on /data: the rootfs is replaced wholesale by A/B
# updates, and per-image keys made every OTA look like a MITM.
HostKey /data/ssh/ssh_host_ed25519_key

# Authorized keys are per-box state, not image content: the generic
# image ships trusting nobody. Keys arrive via the boompi-box bundle
# (flash-time), the web hardware page (pre-lock), provision scripts,
# or `boompi-box add-key` on the console.
AuthorizedKeysFile /data/ssh/authorized_keys

# Key-only over the network. The console root password (see
# docs/SECURITY.md) never works here: prohibit-password is the
# OpenSSH default for root, made explicit alongside the global
# password switch-off.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
