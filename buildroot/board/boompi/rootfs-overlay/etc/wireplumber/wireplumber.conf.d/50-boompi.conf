# Boompi appliance overrides (findings from Phase 0 / dev bring-up):
#
# 1. No logind seat exists on the appliance - without this, the Bluetooth
#    monitor silently never registers A2DP endpoints (adapter class stays
#    non-audio and iPhones filter the device out of their list).
# 2. Never suspend ALSA sinks - suspend/resume causes audible pops on the
#    DAC/USB audio (this properly replaces v1's `ffplay /dev/zero` hack).
# 3. Advertise A2DP sink only: HFP/HSP endpoints make phones/Macs start
#    their post-pairing profile chain with Hands-Free, whose flaky
#    negotiation aborts the chain before A2DP - a fresh pairing ends up
#    with no audio until a manual reconnect. No mic on a boombox anyway.

wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
}

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        # Never suspend (close) the device...
        session.suspend-timeout-seconds = 0
        # ...and never pause the node either: on the Pi 4 box's I2S DAC
        # (Raspiaudio Audio+), idle-pausing gates the bit clock and every
        # stream start/stop pops audibly - suspend-timeout alone was not
        # enough. Keeping the node running
        # clocks out silence continuously: v1's `ffplay /dev/zero` hack,
        # done properly.
        node.pause-on-idle = false
      }
    }
  }
]
