# Route Bluetooth audio into the music bus (see
# pipewire.conf.d/40-boompi-music-bus.conf) instead of the default
# sink: music streams mix on the bus at unity and the loopback
# carries the one music volume into the real sink. The AirPlay and
# Spotify bridges target the bus via their own stream properties.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        target.object = "music-bus"
      }
    }
  }
]
