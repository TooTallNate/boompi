# Keep PipeWire OUT of the AVRCP absolute-volume handshake.
#
# With hw-volume enabled (the default), PipeWire's participation in
# the volume negotiation flips iOS into SOURCE-side scaling: the
# phone attenuates its own PCM (a cubic taper - bench-measured
# 28.7dB swing across a 3x volume ratio) and the speaker loses
# rendering control. That behavior forced the old Phone/Speaker
# volume-mode split and the visualizer's in-stream volume
# compensation.
#
# With hw-volume disabled the host ignores AVRCP volume exactly like
# boompi v1's PulseAudio 14 did, and iOS reverts to spec behavior:
# full-scale PCM, SetAbsoluteVolume commands only, sink renders the
# volume. Bench-proven with a constant sine: PCM level identical
# (-60.9 dBFS) while the phone commanded volumes 0 through 118.
# boompid consumes the transport Volume property and applies it to
# the PipeWire sink - the same model as AirPlay (DACP) and Spotify
# Connect (Spirc).
monitor.bluez.properties = {
  bluez5.enable-hw-volume = false
}
