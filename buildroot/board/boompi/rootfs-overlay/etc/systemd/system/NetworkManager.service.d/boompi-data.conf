# NM reads its keyfile store from /data (see NetworkManager.conf):
# order after the mount so keyfiles are present on a healthy boot -
# but do NOT hard-require it. When /data is unmountable, wired DHCP
# is the box's only remaining management path (field-bitten: a
# RequiresMountsFor here turned a damaged data partition into a box
# with no wifi, no ethernet, no sshd, and no console).
[Unit]
After=data.mount systemd-tmpfiles-setup.service
