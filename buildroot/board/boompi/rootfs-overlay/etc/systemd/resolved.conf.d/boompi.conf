# One mDNS responder per box: avahi carries every service advert
# (AirPlay via shairport-sync, Spotify Connect zeroconf, boompid).
# systemd-resolved's built-in responder (compile default
# MulticastDNS=yes in systemd 258) claims <hostname>.local too, and
# two responders on one box fight over the name: avahi loses the
# probe race and renames itself - on the bench the Pi 3 looped
# through 2100+ renames without ever registering its services (no
# AirPlay, no Spotify), and the Pi 4 settled on a shifted hostname
# that broke AirPlay connects against its stale service records.
# resolved keeps doing unicast DNS; it just stays out of mDNS.
[Resolve]
MulticastDNS=no
