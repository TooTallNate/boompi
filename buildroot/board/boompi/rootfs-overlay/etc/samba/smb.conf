# Boompi guest SMB share - the games library only. Never widen this
# to /data: the share is safe because ssh keys, Wi-Fi credentials,
# and the box profile are not inside it, not because anything masks
# them (scoping beats masking). Trust model matches the web upload
# API: anyone on the LAN can manage ROMs; see docs/SECURITY.md.

[global]
server string = Boompi
server role = standalone server
security = user
map to guest = Bad User
guest account = nobody
# SMB2+ over 445 only; no NetBIOS, discovery is avahi's job.
   smb ports = 445
   disable netbios = yes
   # smbd would otherwise register its own _smb._tcp instance under the
   # machine hostname (BOOMPI-XXXX) via avahi, duplicating the pretty
   # speaker-name advert boompid maintains (netname.rs).
   multicast dns register = no
server min protocol = SMB2_10
# Not a print server, not a WINS anything.
load printers = no
printing = bsd
printcap name = /dev/null
disable spoolss = yes
dns proxy = no

[games]
path = /data/games
browseable = yes
read only = no
guest ok = yes
guest only = yes
# Guests authenticate as nobody; file operations run as root so the
# library matches what boompid reads and the web API writes.
force user = root
create mask = 0644
directory mask = 0755
# Keep macOS metadata droppings and upload temp files out of the
# library (the scanner also skips dotfiles - belt and suspenders).
veto files = /._*/.DS_Store/.Trashes/.TemporaryItems/.upload-*/
delete veto files = yes
