# Load the bluetooth core module at boot even when no adapter is
# attached yet. bluez's unit has
#   ConditionPathIsDirectory=/sys/class/bluetooth
# which only exists once this module is loaded — without it, a missing
# (or late-enumerating) dongle makes every D-Bus activation of org.bluez
# get "skipped, unmet condition" and boompid burns 25s activation
# timeouts in a loop (first Pi 4 OOBE: bluetoothd took 12 minutes to
# come up). With the module preloaded, bluetoothd starts once at boot
# and hotplugged adapters just work.
bluetooth
