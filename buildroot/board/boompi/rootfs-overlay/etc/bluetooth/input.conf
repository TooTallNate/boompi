# BlueZ input (HID) profile configuration.
#
# ClassicBondedOnly=true (the default since the CVE-2020-0556
# mitigation) refuses HID connections from devices without a bond.
# Many gamepads - 8BitDo in most modes, some Nintendo pads - pair
# with no (or a fragile) bond: the first connection works because it
# rides the pairing flow, and every reconnect after a power cycle is
# silently rejected. The pad blinks for a while and gives up.
#
# Relaxing this accepts the CVE's premise (a nearby attacker
# impersonating an input device while the box is running). The box is
# a speaker on a shelf: pads can only be introduced while the user
# holds the pairing window open, there is no sensitive input to
# sniff, and a boombox that gamepads cannot reconnect to is broken.
[General]
ClassicBondedOnly=false
