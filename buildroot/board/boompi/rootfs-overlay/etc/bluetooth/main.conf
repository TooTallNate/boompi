# Boompi Bluetooth configuration (shared baseline; the Pi 3 overlay
# replaces this file to add its CSR-dongle workaround).

[General]
# Experimental D-Bus interfaces: exposes MediaPlayer1.ObexPort and
# Track.ImgHandle for AVRCP cover art.
Experimental = true

# A speaker should stay discoverable; boompid manages pairing mode.
DiscoverableTimeout = 0

# Audio/Video major class + Loudspeaker minor (0x240414). Apple devices
# classify by Class of Device and won't even attempt A2DP against a
# device without an audio class — pairing "succeeds" as a generic
# gadget with no audio output option. (An adapter power-cycle resets a
# runtime-set class; configuring it here survives.)
Class = 0x240414

# Allow a phone that 'forgot' this speaker to pair again: with the default
# ('never'), the stale server-side bond makes every re-pair attempt fail
# instantly ('unsuccessful' on iOS) until the speaker-side bond is removed
# too. JustWorks is our only pairing model, so repairing must be seamless.
JustWorksRepairing = always

# NB on AVRCP absolute volume (phone buttons driving speaker volume):
# it needs no main.conf settings — the defaults are correct. It was
# broken by a bluez 5.79 bug (inverted condition in avrcp target_init
# hides EVENT_VOLUME_CHANGED from category-2 peers like iPhones, so iOS
# falls back to scaling its own PCM); fixed by the backported upstream
# patch in patches/bluez5_utils/ (bluez commit de1b3a5ac3, issue #1007).
# Diagnosed on the Pi 4 bench via btmon: our GetCapabilities reply was
# missing event 0x0d until the patched bluetoothd ran.

[Policy]
AutoEnable = true
