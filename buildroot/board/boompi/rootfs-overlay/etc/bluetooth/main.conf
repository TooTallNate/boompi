# Boompi Bluetooth configuration.

[General]
# Experimental D-Bus interfaces: exposes MediaPlayer1.ObexPort and
# Track.ImgHandle for AVRCP cover art (Phase 3 artwork pipeline).
Experimental = true

# A speaker should stay discoverable; boompid manages pairing mode.
DiscoverableTimeout = 0

# Audio/Video major class + Loudspeaker minor (0x240414). Apple devices
# classify by Class of Device and won't even attempt A2DP against a
# device without an audio class — pairing "succeeds" as a generic
# gadget with no audio output option. (An adapter power-cycle resets a
# runtime-set class; configuring it here survives.)
Class = 0x240414

# Allow a phone that 'forgot' this speaker to pair again: with the default
# ('never'), the stale server-side bond makes every re-pair attempt fail
# instantly ('unsuccessful' on iOS) until the speaker-side bond is removed
# too. JustWorks is our only pairing model (counterfeit-CSR dongle can't
# do MITM numeric comparison), so repairing must be seamless.
JustWorksRepairing = always

[Policy]
AutoEnable = true
