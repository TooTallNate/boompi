# Dedicated DHCP only. Do not load /etc/dnsmasq.conf or NM's configuration.
port=0
interface=br-pan
except-interface=lo
bind-interfaces
dhcp-range=10.77.0.10,10.77.0.50,255.255.255.0,1h
# Empty options suppress dnsmasq's default router and DNS advertisements.
dhcp-option=option:router
dhcp-option=option:dns-server
# With no lease-change script, this keeps leases entirely in memory.
leasefile-ro
pid-file=
log-facility=-
