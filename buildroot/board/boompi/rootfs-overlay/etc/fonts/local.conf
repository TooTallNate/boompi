<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Emoji in user content (speaker name, track metadata). The software
     renderer needs the MONOCHROME Noto Emoji (color CBDT fonts rasterize
     as empty); when the UI moves to the Skia renderer, switch the alias to
     "Noto Color Emoji" and ship that font instead. -->
<fontconfig>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Emoji</family></prefer>
  </alias>
</fontconfig>
