<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Emoji in user content (speaker name, track metadata). Both boards run
     Slint's Skia renderer; color emoji come from Noto Color Emoji (CBDT),
     discovered via fontconfig and decoded by a PNG-capable freetype
     (BR2_PACKAGE_LIBPNG). -->
<fontconfig>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
