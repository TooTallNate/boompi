<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Emoji in user content (speaker name, track metadata). Both boards run
     Slint's Skia renderer; the default emoji font is Noto Color Emoji
     (CBDT), decoded by a PNG-capable freetype (BR2_PACKAGE_LIBPNG).

     Downloaded emoji fonts live in /data/fonts, and boompid enforces the
     user's choice through /data/fontconfig/emoji.conf (rejectfont rules
     hiding the non-chosen families + an alias for the winner). The alias
     below is the pre-boompid fallback for the first moments of boot. -->
<fontconfig>
  <dir>/data/fonts</dir>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <include ignore_missing="yes">/data/fontconfig/emoji.conf</include>
</fontconfig>
