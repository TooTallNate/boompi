<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Pi 4: the UI runs Slint's Skia (GPU) renderer, which rasterizes color
     emoji fonts properly - prefer the color Noto over the shared overlay's
     monochrome default (which remains for the software-rendered Pi 3). -->
<fontconfig>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
