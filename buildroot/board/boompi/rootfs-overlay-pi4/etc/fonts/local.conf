<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Pi 4: the UI runs Slint's Skia (GPU) renderer; color emoji come from
     Noto Color Emoji (CBDT), discovered via fontconfig and decoded by a
     PNG-capable freetype (BR2_PACKAGE_LIBPNG). -->
<fontconfig>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
