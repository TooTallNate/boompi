<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Pi 4: the UI runs Slint's Skia (GPU) renderer with Twemoji (COLRv0)
     as the color emoji font. The UI wires the fallback itself at runtime
     (boompi-ui registers the font with fontique); this alias just keeps
     fc-match and any other fontconfig consumers consistent. -->
<fontconfig>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Twemoji Mozilla</family></prefer>
  </alias>
</fontconfig>
