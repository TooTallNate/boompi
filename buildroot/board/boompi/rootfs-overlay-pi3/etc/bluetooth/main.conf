# Boompi Bluetooth configuration - Pi 3 board. Same as the shared
# main.conf plus the SecureConnections workaround (kept board-level:
# it is required for the bench box's counterfeit-CSR USB dongle and
# harmless for other adapters - pairing falls back to legacy SSP).
# Keep the two files in sync when changing common settings.

[General]
# Experimental D-Bus interfaces: exposes MediaPlayer1.ObexPort and
# Track.ImgHandle for AVRCP cover art.
Experimental = true

# A speaker should stay discoverable; boompid manages pairing mode.
DiscoverableTimeout = 0

# Audio/Video major class + Loudspeaker minor (0x240414). Apple devices
# classify by Class of Device and won't even attempt A2DP against a
# device without an audio class - pairing "succeeds" as a generic
# gadget with no audio output option. (An adapter power-cycle resets a
# runtime-set class; configuring it here survives.)
Class = 0x240414

# Allow a phone that 'forgot' this speaker to pair again: with the default
# ('never'), the stale server-side bond makes every re-pair attempt fail
# instantly ('unsuccessful' on iOS) until the speaker-side bond is removed
# too. JustWorks is our only pairing model (counterfeit-CSR dongle can't
# do MITM numeric comparison), so repairing must be seamless.
JustWorksRepairing = always

# The counterfeit-CSR USB dongle advertises Secure Connections but fails
# the SC pairing handshake. bluetoothd disables it natively (this replaced
# a btmgmt-at-boot unit: buildroot's bluez doesn't even install btmgmt).
# Pi-3-only: the Pi 4 box uses the onboard BCM43455, which does SC fine.
SecureConnections = off

# NB on AVRCP absolute volume: no main.conf settings needed (defaults
# are correct) - the bluez 5.79 target_init bug is fixed by the patch
# in patches/bluez5_utils/. See the shared main.conf for the story.

[Policy]
AutoEnable = true
