# Pi 3 box: A/B slot layout for over-the-air updates, mirroring the
# Pi 4 layout exactly so the same partition numbers and OTA scripts
# work on both boards. Updates are trialled by kexec-ing the candidate
# slot (boompi-update-slot) and committed by rewriting autoboot.txt
# (boompi-boot-commit):
#
#   p1  boot-a   (FAT: firmware + kernel + cmdline→rootfs-a, autoboot.txt)
#   p2  boot-b   (FAT: firmware + kernel + cmdline→rootfs-b)
#   p3  rootfs-a
#   p4  (extended)
#   p5  rootfs-b
#   p6  data     (persistent state - never touched by updates)
#
# bootcode.bin reads autoboot.txt/boot_partition on p1 (verified: the
# strings are in the binary). armstub8.bin is TF-A BL31 for PSCI - the
# kexec trial boot needs parkable CPUs, same as the Pi 4.
# cmdline-a/b.txt and autoboot.txt are generated by post-image.sh.

image boot-a.vfat {
	vfat {
		files = {
			"bcm2710-rpi-3-b.dtb",
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/start.elf",
			"rpi-firmware/overlays",
			"armstub8.bin",
			"Image"
		}
		file cmdline.txt {
			image = "cmdline-a.txt"
		}
		file autoboot.txt {
			image = "autoboot.txt"
		}
	}
	size = 64M
}

image boot-b.vfat {
	vfat {
		files = {
			"bcm2710-rpi-3-b.dtb",
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/start.elf",
			"rpi-firmware/overlays",
			"armstub8.bin",
			"Image"
		}
		file cmdline.txt {
			image = "cmdline-b.txt"
		}
		file autoboot.txt {
			image = "autoboot.txt"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "data"
	}
	size = 512M
}

image sdcard.img {
	hdimage {
	}

	partition boot-a {
		partition-type = 0xC
		bootable = "true"
		image = "boot-a.vfat"
	}

	partition boot-b {
		partition-type = 0xC
		image = "boot-b.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
