image boot.vfat {
	vfat {
		files = {
			"bcm2711-rpi-4-b.dtb",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/start4.elf",
			"rpi-firmware/overlays",
			"Image"
		}
	}
	size = 64M
}

# Persistent device state (/data): config, BT pairings, Wi-Fi profiles,
# streaming credentials. Separating it from the rootfs makes a reflash an
# OS swap instead of a factory reset — and is a prerequisite for A/B
# rootfs slots later (see docs/PLAN.md, updates). Built empty (genimage's
# rootpath is an empty dir; see post-image.sh).
image data.ext4 {
	ext4 {
		label = "data"
	}
	size = 512M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
