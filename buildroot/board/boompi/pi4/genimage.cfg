# Pi 4 box: A/B slot layout for over-the-air updates (the SD card is
# effectively inaccessible once the box is assembled). Updates are
# trialled by kexec-ing the candidate slot (boompi-update-slot) and
# committed by rewriting autoboot.txt (boompi-boot-commit):
#
#   p1  boot-a   (FAT: firmware + kernel + cmdline→rootfs-a, autoboot.txt)
#   p2  boot-b   (FAT: firmware + kernel + cmdline→rootfs-b)
#   p3  rootfs-a
#   p4  (extended)
#   p5  rootfs-b
#   p6  data     (persistent state - never touched by updates)
#
# autoboot.txt lives on p1 (the EEPROM reads it there regardless of the
# active slot) and is rewritten by boompi-boot-commit / boompi-update-slot.
# cmdline-a/b.txt and autoboot.txt are generated by post-image.sh.

image boot-a.vfat {
	vfat {
		# Force FAT32: mkdosfs picks FAT16 at this size, and the Pi 3
		# ROM refuses a FAT16 filesystem behind the 0xC (FAT32 LBA) MBR
		# type byte. FAT32 + 0xC matches every known-good Pi card.
		extraargs = "-F 32"
		files = {
			"bcm2711-rpi-4-b.dtb",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/start4.elf",
			"rpi-firmware/overlays",
			"bl31.bin",
			"Image"
		}
		file cmdline.txt {
			image = "cmdline-a.txt"
		}
		file autoboot.txt {
			image = "autoboot.txt"
		}
	}
	size = 64M
}

image boot-b.vfat {
	vfat {
		# Force FAT32: mkdosfs picks FAT16 at this size, and the Pi 3
		# ROM refuses a FAT16 filesystem behind the 0xC (FAT32 LBA) MBR
		# type byte. FAT32 + 0xC matches every known-good Pi card.
		extraargs = "-F 32"
		files = {
			"bcm2711-rpi-4-b.dtb",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/start4.elf",
			"rpi-firmware/overlays",
			"bl31.bin",
			"Image"
		}
		file cmdline.txt {
			image = "cmdline-b.txt"
		}
		file autoboot.txt {
			image = "autoboot.txt"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "data"
	}
	size = 512M
}

image sdcard.img {
	hdimage {
		# 4MB-aligned partitions starting at 4MB - the genimage default
		# packs partitions from sector 1, which the Pi 3 boot ROM will
		# not read (the Pi 4 EEPROM tolerates it). Standard Pi layout.
		align = 4M
	}

	partition boot-a {
		partition-type = 0xC
		image = "boot-a.vfat"
	}

	partition boot-b {
		partition-type = 0xC
		image = "boot-b.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
